<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meet Desk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    [v-cloak] { display: none; }
    body { font-family: 'Inter', sans-serif; }
    @keyframes spin-dots {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1); }
    }
    .loading-dot { animation: spin-dots 1.2s ease-in-out infinite; }
    .loading-dot:nth-child(1) { animation-delay: 0s; }
    .loading-dot:nth-child(2) { animation-delay: 0.15s; }
    .loading-dot:nth-child(3) { animation-delay: 0.3s; }
    .loading-dot:nth-child(4) { animation-delay: 0.45s; }
    .loading-dot:nth-child(5) { animation-delay: 0.6s; }
    .loading-dot:nth-child(6) { animation-delay: 0.75s; }
    .loading-dot:nth-child(7) { animation-delay: 0.9s; }
    .loading-dot:nth-child(8) { animation-delay: 1.05s; }
  </style>
</head>
<body>
  <div id="app" v-cloak>
    <div class="min-h-screen bg-white flex flex-col items-center justify-center">
      <div class="flex items-center gap-4 mb-8">
        <div class="w-14 h-14 bg-[#4285F4] rounded-xl flex items-center justify-center shadow-md">
          <svg class="w-8 h-8 text-white" fill="currentColor" viewBox="0 0 24 24">
            <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
          </svg>
        </div>
        <h1 class="text-3xl font-bold text-black">Meet Desk</h1>
      </div>
      <div class="flex gap-2">
        <span v-for="i in 8" :key="i" class="loading-dot w-2 h-2 rounded-full bg-[#4285F4]"></span>
      </div>
    </div>
  </div>

  <script>
    const { createApp } = Vue;
    createApp({
      mounted() {
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 2500);
      }
    }).mount('#app');
  </script>
</body>
</html>
