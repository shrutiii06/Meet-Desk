<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Meet Desk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    [v-cloak] { display: none; }
    body { font-family: 'Inter', sans-serif; }
  </style>
  <script src="js/api.js"></script>
</head>
<body>
  <div id="app" v-cloak>
    <div class="min-h-screen bg-[#E6F0FF] flex">
      <div class="flex-1 flex items-center justify-center p-8">
        <div class="bg-white rounded-2xl shadow-xl p-10 w-full max-w-md">
          <div class="flex justify-center mb-6">
            <div class="w-14 h-14 bg-[#4285F4] rounded-xl flex items-center justify-center shadow-md">
              <svg class="w-8 h-8 text-white" fill="currentColor" viewBox="0 0 24 24">
                <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
              </svg>
            </div>
          </div>
          <h2 class="text-2xl font-bold text-black text-center mb-8">Create New Account</h2>
          
          <div class="space-y-4 mb-4">
            <div class="flex items-center bg-gray-100 rounded-xl px-4 py-3">
              <svg class="w-5 h-5 text-gray-500 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>
              <input v-model="registerName" type="text" placeholder="Full Name" class="flex-1 bg-transparent outline-none text-gray-700 placeholder-gray-500">
            </div>
            <div class="flex items-center bg-gray-100 rounded-xl px-4 py-3">
              <svg class="w-5 h-5 text-gray-500 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
              </svg>
              <input v-model="registerPhone" type="tel" placeholder="Phone Number" class="flex-1 bg-transparent outline-none text-gray-700 placeholder-gray-500">
            </div>
            <div class="flex items-center bg-gray-100 rounded-xl px-4 py-3">
              <svg class="w-5 h-5 text-gray-500 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
              </svg>
              <input v-model="registerEmail" type="email" placeholder="Email" class="flex-1 bg-transparent outline-none text-gray-700 placeholder-gray-500">
            </div>
            <div class="flex items-center bg-gray-100 rounded-xl px-4 py-3">
              <svg class="w-5 h-5 text-gray-500 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
              </svg>
              <input v-model="registerPassword" :type="showPassword ? 'text' : 'password'" placeholder="Password" class="flex-1 bg-transparent outline-none text-gray-700 placeholder-gray-500">
              <button @click="showPassword = !showPassword" type="button" class="text-gray-500 hover:text-gray-700">
                <svg v-if="!showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                </svg>
                <svg v-else class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
              </button>
            </div>
          </div>
          
          <div class="flex items-center mb-6">
            <input v-model="rememberMe" type="checkbox" id="rememberReg" class="w-4 h-4 rounded border-2 border-[#4285F4] text-[#4285F4] focus:ring-[#4285F4]">
            <label for="rememberReg" class="ml-2 text-gray-700">Remember me</label>
          </div>
          
          <p v-if="errorMessage" class="text-red-500 text-sm mb-4">{{ errorMessage }}</p>
          <button @click="handleRegister" class="w-full bg-[#4285F4] text-white font-semibold py-3 rounded-xl hover:bg-[#3367D6] transition-colors mb-6">Sign up</button>
          
          <div class="relative mb-6">
            <div class="absolute inset-0 flex items-center">
              <div class="w-full border-t border-gray-300"></div>
            </div>
            <div class="relative flex justify-center">
              <span class="px-4 bg-white text-gray-500 text-sm">or continue with</span>
            </div>
          </div>
          
          <div class="flex justify-center gap-4 mb-6">
            <button class="w-12 h-12 rounded-full bg-[#1877F2] flex items-center justify-center text-white hover:bg-[#166FE5] transition-colors">
              <span class="font-bold text-lg">f</span>
            </button>
            <button class="w-12 h-12 rounded-full bg-white border border-gray-300 flex items-center justify-center hover:bg-gray-50 transition-colors">
              <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            </button>
            <button class="w-12 h-12 rounded-full bg-white border border-gray-300 flex items-center justify-center hover:bg-gray-50 transition-colors text-black">
              <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
            </button>
          </div>
          
          <p class="text-center text-gray-600">Already have an account? <a href="login.html" class="text-[#4285F4] underline font-medium">Sign in</a></p>
        </div>
      </div>
      <div class="flex-1 hidden lg:flex flex-col justify-center p-12 bg-[#E6F0FF]">
        <h3 class="text-2xl font-bold text-black mb-6">Unlock Your Team's Potential</h3>
        <ul class="space-y-4 mb-8">
          <li class="flex items-center text-gray-700">
            <span class="w-2 h-2 bg-[#4285F4] rounded-full mr-3"></span> Seamless Collaboration
          </li>
          <li class="flex items-center text-gray-700">
            <span class="w-2 h-2 bg-[#4285F4] rounded-full mr-3"></span> Data-Driven Insights
          </li>
          <li class="flex items-center text-gray-700">
            <span class="w-2 h-2 bg-[#4285F4] rounded-full mr-3"></span> Secure & Scalable
          </li>
        </ul>
        <div class="flex items-end justify-center mt-auto">
          <div class="relative w-72 h-72 flex items-center justify-center">
            <div class="absolute w-48 h-48 rounded-full bg-gradient-to-br from-blue-300 to-blue-400 border-4 border-blue-200 flex items-center justify-center">
              <div class="w-32 h-32 rounded-full bg-blue-100/50"></div>
            </div>
            <svg class="absolute w-24 h-24 text-[#4285F4] opacity-80 -top-2" fill="currentColor" viewBox="0 0 24 24"><path d="M20 18c1.1 0 1.99-.9 1.99-2L22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/></svg>
            <svg class="absolute w-12 h-12 text-[#34A853] opacity-80 -bottom-4 -left-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
            <svg class="absolute w-12 h-12 text-[#FBBC05] opacity-80 -bottom-2 -right-2" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12m-3.2 0a3.2 3.2 0 1 0 6.4 0a3.2 3.2 0 1 0 -6.4 0"/></svg>
            <svg class="absolute w-10 h-10 text-[#EA4335] opacity-80 -top-4 -right-4" fill="currentColor" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z"/></svg>
          </div>
        </div>
      </div>
    </div>
  </div>

 
  <script>
    const { createApp } = Vue;
    createApp({
      data() {
        return {
          registerName: '',
          registerEmail: '',
          registerPhone: '',
          registerPassword: '',
          rememberMe: false,
          showPassword: false,
          errorMessage: ''
        };
      },
      methods: {
        async handleRegister() {
          this.errorMessage = '';
          if (!this.registerName.trim()) {
            this.errorMessage = 'Please enter your name.';
            return;
          }
          if (!this.registerEmail.trim()) {
            this.errorMessage = 'Please enter your email.';
            return;
          }
          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!emailRegex.test(this.registerEmail.trim())) {
            this.errorMessage = 'Please enter a valid email address.';
            return;
          }
          if (!this.registerPassword) {
            this.errorMessage = 'Please enter a password.';
            return;
          }
          if (this.registerPassword.length < 6) {
            this.errorMessage = 'Password must be at least 6 characters.';
            return;
          }
          try {
            const res = await fetch(`${API_URL}/auth/register.php`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                name: this.registerName.trim(),
                email: this.registerEmail.trim(),
                phone: this.registerPhone.trim() || 'Not provided',
                password: this.registerPassword
              })
            });
            const data = await res.json();
            if (!res.ok) {
              this.errorMessage = data.error || 'Registration failed';
              return;
            }
            
            // Store registration success message for login page
            sessionStorage.setItem('registration_success', 'true');
            sessionStorage.setItem('registered_email', data.user.email);
            
            // Redirect directly to login page
            window.location.href = 'login.html';
          } catch (err) {
            console.error('Registration error:', err);
            console.error('API_URL:', API_URL);
            this.errorMessage = 'Could not connect to server. Error: ' + err.message;
          }
        }
      }
    }).mount('#app');
  </script>
</body>
</html>
