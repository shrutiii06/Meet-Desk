<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Registration Test</title>
  <script src="js/api.js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
    input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; }
    button { background: #4285F4; color: white; padding: 12px 30px; border: none; border-radius: 5px; cursor: pointer; width: 100%; }
    button:hover { background: #3367D6; }
    .result { margin-top: 20px; padding: 15px; border-radius: 4px; }
    .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Quick Registration Test</h1>
  <p><strong>API URL:</strong> <span id="api-url"></span></p>
  
  <form id="testForm">
    <input type="text" id="name" placeholder="Full Name" value="Test User" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password (min 6 chars)" value="test123456" required>
    <button type="submit">Register</button>
  </form>

  <div id="result"></div>

  <script>
    document.getElementById('api-url').textContent = API_URL;
    
    // Generate random email
    document.getElementById('email').value = 'test' + Date.now() + '@test.com';

    document.getElementById('testForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = '<p>Registering...</p>';

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        console.log('Sending to:', `${API_URL}/auth/register.php`);
        
        const response = await fetch(`${API_URL}/auth/register.php`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });

        console.log('Response status:', response.status);
        console.log('Response headers:', response.headers);

        const text = await response.text();
        console.log('Raw response:', text);

        let data;
        try {
          data = JSON.parse(text);
        } catch (parseError) {
          throw new Error('Invalid JSON response: ' + text.substring(0, 100));
        }

        if (response.ok) {
          resultDiv.className = 'result success';
          resultDiv.innerHTML = `
            <h3>✓ Registration Successful!</h3>
            <p><strong>Name:</strong> ${data.user.name}</p>
            <p><strong>Email:</strong> ${data.user.email}</p>
            <p><strong>Status:</strong> ${data.user.status}</p>
            <p><strong>Message:</strong> ${data.message}</p>
            <pre>${JSON.stringify(data, null, 2)}</pre>
          `;
        } else {
          resultDiv.className = 'result error';
          resultDiv.innerHTML = `
            <h3>✗ Registration Failed</h3>
            <p><strong>Error:</strong> ${data.error || 'Unknown error'}</p>
            <pre>${JSON.stringify(data, null, 2)}</pre>
          `;
        }
      } catch (error) {
        console.error('Registration error:', error);
        resultDiv.className = 'result error';
        resultDiv.innerHTML = `
          <h3>✗ Connection Error</h3>
          <p><strong>Error:</strong> ${error.message}</p>
          <p>Check browser console for details (F12)</p>
        `;
      }
    });
  </script>
</body>
</html>
